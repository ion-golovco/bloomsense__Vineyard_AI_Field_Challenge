[project]
name = "gigahack-marcaj-backend"
version = "0.1.0"
description = "Geospatial processing and demo API for the Marcaj vineyard challenge"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.117,<1",
  "uvicorn>=0.35,<1",
  "pyproj>=3.7,<4",
  "shapely>=2.1,<3",
  "rasterio>=1.4,<2",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
]

[project.scripts]
marcaj-export = "marcaj.export:main"
marcaj-pack = "marcaj.package:main"
marcaj-scene = "marcaj.cvat:main"
marcaj-judge = "marcaj.judge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marcaj"]

[dependency-groups]
lab = [
    "ipyleaflet>=0.19,<1",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.2,<5",
]
